<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Duty Roster</title>

<style>
body{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#eef2f5;
    padding:20px;
    margin:0;
}

.container{
    max-width:750px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#1565c0;
    margin-top: 0;
}

/* উপরে সময় ও মাস গণনার হেডার সেকশন */
.top-header {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.live-clock {
    flex: 1 1 250px;
    background: #1565c0;
    color: white;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ডান দিকে মাসের হিসাব কার্ড */
.month-tracker {
    flex: 0 1 220px;
    background: #e3f2fd;
    border: 1px solid #bbdefb;
    color: #0d47a1;
    text-align: center;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

.month-tracker-title {
    font-weight: bold;
    border-bottom: 1px dashed #90caf9;
    padding-bottom: 4px;
    margin-bottom: 6px;
    color: #1565c0;
}

.month-tracker-info {
    font-size: 0.95rem;
    font-weight: bold;
}

.controls{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    background: #f8f9fa;
    padding: 15px;
    border-radius: 10px;
}

.control-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

input, button{
    padding:10px 15px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size: 14px;
}

button{
    background:#1565c0;
    color:white;
    cursor:pointer;
    border: none;
    font-weight: bold;
    transition: background 0.3s;
    margin-top: auto;
}

button:hover{
    background:#0d47a1;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th, td{
    border:1px solid #e0e0e0;
    padding:12px 8px;
    text-align:center;
    font-size: 14px;
}

th{
    background:#1565c0;
    color:white;
}

.off{
    background:#ffebee;
    color:#c62828;
    font-weight:bold;
}

.shift1{ background:#e3f2fd; }
.shift2{ background:#fff3e0; }
.shift3{ background:#ede7f6; }

/* স্ট্যাটাস ব্যাজসমূহ */
.badge {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
}

.badge-running { background: #4caf50; color: white; }
.badge-finished { background: #9e9e9e; color: white; }
.badge-upcoming { background: #2196f3; color: white; }
.badge-off { background: #e53935; color: white; }

.timer-text {
    font-size: 11px;
    color: #2e7d32;
    margin-top: 5px;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

<h2>আবুল কালাম আজাদ</h2>

<!-- লাইভ টাইম ক্লক ও ডান পাশের মাস ট্র্যাক সেকশন -->
<div class="top-header">
    <div class="live-clock" id="liveClock">
        বর্তমান সময়: লোড হচ্ছে...
    </div>
    <div class="month-tracker" id="monthTracker">
        <div class="month-tracker-title">📅 মাসের হিসাব</div>
        <div class="month-tracker-info" id="monthTrackerText">লোড হচ্ছে...</div>
    </div>
</div>

<div class="controls">
    <div class="control-group">
        <label>মাস:</label>
        <input type="month" id="month">
    </div>
    <div class="control-group">
        <label>তারিখ (একদিনের জন্য):</label>
        <input type="date" id="selectedDate">
    </div>
    <button onclick="createDuty()">ফিল্টার করুন</button>
    <button onclick="showAllMonth()" style="background:#455a64;">পুরা মাস দেখুন</button>
</div>

<table>
<thead>
<tr>
<th>তারিখ</th>
<th>বার</th>
<th>ডিউটি ও সময়</th>
<th>অবস্থা (স্ট্যাটাস)</th>
</tr>
</thead>

<tbody id="result"></tbody>

</table>

</div>


<script>

const shifts = [
    { name: "Shift 1", startHour: 6, endHour: 14, isOvernight: false, timeText: "06:00 AM - 02:00 PM" },
    { name: "Shift 2", startHour: 14, endHour: 22, isOvernight: false, timeText: "02:00 PM - 10:00 PM" },
    { name: "Shift 3", startHour: 22, endHour: 6, isOvernight: true, timeText: "10:00 PM - 06:00 AM" }
];

function padTwo(num) {
    return num.toString().padStart(2, '0');
}

// সংখ্যাকে বাংলায় রূপান্তর
function toBengaliNum(num) {
    const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return num.toString().split('').map(d => bengaliDigits[d] || d).join('');
}

// লাইভ ঘড়ি ও ডান দিকের মাসের হিসাব আপডেট
function updateClock() {
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
    document.getElementById("liveClock").innerText = "বর্তমান সময়: " + now.toLocaleDateString("bn-BD", options);

    // মাস গণনা আপডেট
    const currentDay = now.getDate();
    const totalDaysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const remainingDays = totalDaysInMonth - currentDay;

    document.getElementById("monthTrackerText").innerHTML = `
        আজ: <strong>${toBengaliNum(padTwo(currentDay))}</strong> / ${toBengaliNum(totalDaysInMonth)} তম দিন<br>
        <span style="font-size: 0.85rem; color: #c62828;">বাকি: <strong>${toBengaliNum(remainingDays)}</strong> দিন</span>
    `;
}

// রেফারেন্স ডেট: ১ আগস্ট ২০২৬ এ Shift 1 (সকাল ৬টা - দুপুর ২টা)
const baseDate = new Date(2026, 7, 1); // 7 = August (১ আগস্ট)

function getShiftForDate(targetDate) {
    if (targetDate.getDay() === 5) {
        return { isOff: true };
    }

    const diffTime = targetDate.getTime() - baseDate.getTime();
    const diffDays = Math.floor(diffTime / (1000 * 3600 * 24));

    let shiftBlock = Math.floor(diffDays / 6) % 3;
    if (shiftBlock < 0) shiftBlock += 3;

    return { isOff: false, shiftIndex: shiftBlock };
}

function createDuty(){
    let monthValue = document.getElementById("month").value;
    let dateValue = document.getElementById("selectedDate").value;

    if(!monthValue){
        alert("মাস নির্বাচন করুন");
        return;
    }

    let [year, month] = monthValue.split("-");
    let days = new Date(year, month, 0).getDate();
    let html = "";

    let targetDay = dateValue ? new Date(dateValue).getDate() : null;
    let targetMonth = dateValue ? new Date(dateValue).getMonth() + 1 : null;

    const now = new Date();

    for(let d = 1; d <= days; d++){
        if (targetDay && targetMonth && (targetDay !== d || targetMonth !== parseInt(month))) {
            continue;
        }

        let date = new Date(year, month - 1, d);
        let dayName = date.toLocaleDateString("bn-BD", { weekday: "long" });

        let shiftInfo = getShiftForDate(date);

        let duty = "";
        let timeText = "";
        let cls = "";
        let statusBadge = "";
        let timerInfo = "";

        if(shiftInfo.isOff){
            duty = "OFF DAY";
            timeText = "-";
            cls = "off";
            statusBadge = `<span class="badge badge-off">ছুটি</span>`;
        } else {
            let currentShift = shifts[shiftInfo.shiftIndex];
            duty = currentShift.name;
            timeText = currentShift.timeText;
            cls = "shift" + (shiftInfo.shiftIndex + 1);

            let shiftStart = new Date(year, month - 1, d, currentShift.startHour, 0, 0);
            let shiftEnd = new Date(year, month - 1, d, currentShift.endHour, 0, 0);

            if (currentShift.isOvernight) {
                shiftEnd.setDate(shiftEnd.getDate() + 1);
            }

            if (now > shiftEnd) {
                statusBadge = `<span class="badge badge-finished">ডিউটি শেষ</span>`;
            } else if (now >= shiftStart && now <= shiftEnd) {
                statusBadge = `<span class="badge badge-running">ডিউটি রানিং</span>`;
                
                let diffMs = shiftEnd - now;
                let diffSecs = Math.floor(diffMs / 1000);
                let hrs = Math.floor(diffSecs / 3600);
                let mins = Math.floor((diffSecs % 3600) / 60);
                let secs = diffSecs % 60;

                timerInfo = `<div class="timer-text">⏳ শেষ হতে বাকি: ${padTwo(hrs)}:${padTwo(mins)}:${padTwo(secs)}</div>`;
            } else {
                statusBadge = `<span class="badge badge-upcoming">আসন্ন ডিউটি</span>`;
                
                if(now.toDateString() === date.toDateString()){
                    let diffMs = shiftStart - now;
                    let diffSecs = Math.floor(diffMs / 1000);
                    if (diffSecs > 0) {
                        let hrs = Math.floor(diffSecs / 3600);
                        let mins = Math.floor((diffSecs % 3600) / 60);
                        let secs = diffSecs % 60;
                        timerInfo = `<div class="timer-text">⏱️ শুরু হতে বাকি: ${padTwo(hrs)}:${padTwo(mins)}:${padTwo(secs)}</div>`;
                    }
                }
            }
        }

        html += `
        <tr class="${cls}">
            <td>${d}-${month}-${year}</td>
            <td>${dayName}</td>
            <td><strong>${duty}</strong><br><small>${timeText}</small></td>
            <td>${statusBadge} ${timerInfo}</td>
        </tr>
        `;
    }

    if(html === "") {
        html = `<tr><td colspan="4">এই তারিখে কোনো তথ্য পাওয়া যায়নি</td></tr>`;
    }

    document.getElementById("result").innerHTML = html;
}

function showAllMonth(){
    document.getElementById("selectedDate").value = "";
    createDuty();
}

// আজকের প্রাথমিক মান সেট
let today = new Date();
let m = today.getMonth() + 1;
if(m < 10) m = "0" + m;

let d = today.getDate();
if(d < 10) d = "0" + d;

let yyyy = today.getFullYear();

document.getElementById("month").value = yyyy + "-" + m;
document.getElementById("selectedDate").value = yyyy + "-" + m + "-" + d;

// লাইভ টাইমার আপডেট
createDuty();
updateClock();

setInterval(() => {
    updateClock();
    createDuty();
}, 1000);

document.getElementById("month").addEventListener("change", createDuty);
document.getElementById("selectedDate").addEventListener("change", createDuty);

</script>

</body>
</html>
