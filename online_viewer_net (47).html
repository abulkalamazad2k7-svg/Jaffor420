<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Duty Roster</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f6ff;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 15px #ccc;
}

h2{
    text-align:center;
    color:#1565c0;
}

input,button{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:1px solid #aaa;
}

button{
    background:#1565c0;
    color:white;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#1565c0;
    color:white;
}

.off{
    background:#ffdddd;
    color:red;
    font-weight:bold;
}

.shift1{
    background:#e3f2fd;
}

.shift2{
    background:#fff3e0;
}

.shift3{
    background:#ede7f6;
}
</style>

</head>

<body>

<div class="container">

<h2>মাসিক ডিউটি রোস্টার</h2>

<label>মাস নির্বাচন করুন:</label>
<input type="month" id="month">

<button onclick="createDuty()">হিসাব করুন</button>

<table>
<thead>
<tr>
<th>তারিখ</th>
<th>বার</th>
<th>ডিউটি</th>
<th>সময়</th>
</tr>
</thead>

<tbody id="result"></tbody>

</table>

</div>


<script>

const shifts = [
    {
        name:"Shift 1",
        time:"06:00 AM - 02:00 PM"
    },
    {
        name:"Shift 2",
        time:"02:00 PM - 10:00 PM"
    },
    {
        name:"Shift 3",
        time:"10:00 PM - 06:00 AM"
    }
];


function createDuty(){

let monthValue=document.getElementById("month").value;

if(!monthValue){
    alert("মাস নির্বাচন করুন");
    return;
}


let [year,month]=monthValue.split("-");

let days=new Date(year,month,0).getDate();

let html="";

let shiftIndex=0;


for(let d=1; d<=days; d++){

let date=new Date(year,month-1,d);

let dayName=date.toLocaleDateString("bn-BD",
{
weekday:"long"
});


let duty="";
let time="";
let cls="";


/* শুক্রবার Off */
if(date.getDay()==5){

    duty="OFF DAY";
    time="-";
    cls="off";

}
else{

    duty=shifts[shiftIndex].name;
    time=shifts[shiftIndex].time;

    cls="shift"+(shiftIndex+1);

    shiftIndex++;

    if(shiftIndex>=3){
        shiftIndex=0;
    }

}


html += `
<tr class="${cls}">
<td>${d}-${month}-${year}</td>
<td>${dayName}</td>
<td>${duty}</td>
<td>${time}</td>
</tr>
`;

}


document.getElementById("result").innerHTML=html;

}


// আজকের মাস অটো সেট

let today=new Date();

let m=today.getMonth()+1;

if(m<10) m="0"+m;

document.getElementById("month").value=
today.getFullYear()+"-"+m;


createDuty();

</script>

</body>
</html>
